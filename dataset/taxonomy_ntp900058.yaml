# =============================================================================
# Taxonomía Canónica de Residuos Sólidos — Norma Técnica Peruana NTP 900.058
# (7 Categorías para Instituciones, Empresas y Residuos No Municipales)
# =============================================================================
# ADVERTENCIA METODOLÓGICA:
# Esta taxonomía clasifica residuos por APARIENCIA MORFOLÓGICA Y VISUAL en el
# espectro RGB (400-700 nm). No constituye un análisis de composición química
# (como espectroscopía NIR) ni certifica ausencia de peligrosidad biológica/química.
# =============================================================================

version: "2.0.0"
taxonomy_name: "residuos_ntp_900_058_7c"

classes:
  0:
    name: "plastico"
    display_name: "BLANCO - Plasticos"
    ntp_color_name: "BLANCO"
    color_bgr: [245, 245, 245]     # Blanco oficial NTP 900.058 en BGR
    description: "Botellas PET, envases HDPE, tuberias PVC, bolsas LDPE, tapas PP, recipientes, vasos de plastico, bandejas de poliestireno."
  1:
    name: "papel_carton"
    display_name: "AZUL - Papel y carton"
    ntp_color_name: "AZUL"
    color_bgr: [230, 105, 25]      # Azul oficial NTP 900.058 en BGR
    description: "Periodicos, revistas, hojas A4, cuadernos, cajas de carton, cartulinas, bolsas de papel, sobres y tubos de carton."
  2:
    name: "metal"
    display_name: "AMARILLO - Metales"
    ntp_color_name: "AMARILLO"
    color_bgr: [0, 215, 255]       # Amarillo oficial NTP 900.058 en BGR
    description: "Latas de aluminio, latas de conservas, envases de acero, tapas metalicas, ollas, sartenes, tornillos, clavos, alambres y chatarra."
  3:
    name: "vidrio"
    display_name: "GRIS - Vidrio"
    ntp_color_name: "GRIS/PLOMO"
    color_bgr: [155, 155, 155]     # Gris/Plomo oficial NTP 900.058 en BGR
    description: "Botellas, frascos, envases transparentes, vidrio verde, vidrio ambar y fragmentos de vidrio."
  4:
    name: "organico"
    display_name: "MARRON - Organicos"
    ntp_color_name: "MARRON"
    color_bgr: [35, 90, 150]       # Marrón oficial NTP 900.058 en BGR
    description: "Cascaras de frutas, restos de verduras, alimentos sobrantes, cascaras de huevo, residuos de cafe, hojas secas, cesped, flores y ramas."
  5:
    name: "otros_residuos"
    display_name: "NEGRO - No aprovechables"
    ntp_color_name: "NEGRO"
    color_bgr: [40, 40, 40]        # Negro oficial NTP 900.058 en BGR
    description: "Panales, toallas higienicas, servilletas usadas, papel contaminado, envolturas sucias, empaques multicapa metalizados, bolsas de snacks/papas fritas/galletas/caramelos, ceramica, porcelana y colillas."
  6:
    name: "peligroso"
    display_name: "ROJO - Peligrosos"
    ntp_color_name: "ROJO"
    color_bgr: [35, 35, 225]       # Rojo oficial NTP 900.058 en BGR
    description: "Pilas, baterias de litio, medicamentos vencidos, blisteres farmaceuticos, jeringas, agujas, residuos electronicos (RAEE/placas), envases de pesticidas, pinturas, solventes, aceites usados y lamparas fluorescentes."

